<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | Cartly</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body class="dashboard-body">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
      <a href="index.html" class="logo">
        <img src="images/logo-mark.svg" alt="Cartly logo" />
        Cartly
      </a>
      <button class="sidebar-close" aria-label="Close menu">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <nav class="sidebar-links">
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Overview</a>
        <a href="shop.html"><i class="fa-solid fa-store"></i> Shop</a>
        <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
        <a href="wishlist.html"><i class="fa-solid fa-heart"></i> Wishlist</a>
        <a href="orders.html"><i class="fa-solid fa-box"></i> Orders</a>
        <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Profile</a>
      </nav>

      <button class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Log out
      </button>
    </aside>
    <div class="overlay"></div>

    <div class="main">
      <!-- ================= TOP BAR ================= -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <h1>My Profile</h1>
        </div>

        <div class="topbar-right">
          <a href="wishlist.html" class="icon-link" aria-label="Wishlist">
            <i class="fa-regular fa-heart"></i>
            <span class="count wishlist-count">0</span>
          </a>
          <a href="cart.html" class="icon-link" aria-label="Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="count cart-count">0</span>
          </a>
          <a href="profile.html" class="user-chip">
            <span class="avatar user-initials"></span>
            <div>
              <p class="user-name"></p>
              <span>Customer</span>
            </div>
          </a>
        </div>
      </header>

      <!-- ================= PAGE CONTENT ================= -->
      <main class="content">
        <div class="profile-layout">
          <!-- Left: profile summary -->
          <aside class="card profile-card">
            <div class="avatar user-initials"></div>
            <h2 class="user-name"></h2>
            <p id="profile-email"></p>

            <ul class="profile-meta">
              <li><i class="fa-solid fa-phone"></i> <span id="profile-phone"></span></li>
              <li><i class="fa-solid fa-location-dot"></i> <span id="profile-address"></span></li>
              <li><i class="fa-solid fa-calendar"></i> <span id="profile-joined"></span></li>
            </ul>

            <button class="btn btn-danger btn-block" id="delete-account">
              <i class="fa-solid fa-trash"></i> Delete account
            </button>
          </aside>

          <!-- Right: forms -->
          <div class="profile-forms">
            <section class="card">
              <div class="card-header">
                <h2>Personal information</h2>
              </div>

              <div class="alert alert-success" id="info-alert">
                <i class="fa-solid fa-circle-check"></i> Your profile has been updated.
              </div>

              <form id="info-form" novalidate>
                <div class="form-row">
                  <div class="form-group">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName" class="form-control" />
                    <small class="error-text" id="fullName-error"></small>
                  </div>
                  <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" class="form-control" disabled />
                    <small class="error-text" id="email-error"></small>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="0801 234 5678" />
                    <small class="error-text" id="phone-error"></small>
                  </div>
                  <div class="form-group">
                    <label for="address">Delivery address</label>
                    <input type="text" id="address" class="form-control" placeholder="12 Allen Avenue, Ikeja" />
                    <small class="error-text" id="address-error"></small>
                  </div>
                </div>
                <button type="submit" class="btn">Save changes</button>
              </form>
            </section>

            <section class="card">
              <div class="card-header">
                <h2>Change password</h2>
              </div>

              <div class="alert" id="password-alert"></div>

              <form id="password-form" novalidate>
                <div class="form-group">
                  <label for="currentPassword">Current password</label>
                  <input type="password" id="currentPassword" class="form-control" />
                  <small class="error-text" id="currentPassword-error"></small>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" class="form-control" />
                    <small class="error-text" id="newPassword-error"></small>
                  </div>
                  <div class="form-group">
                    <label for="confirmNewPassword">Confirm new password</label>
                    <input type="password" id="confirmNewPassword" class="form-control" />
                    <small class="error-text" id="confirmNewPassword-error"></small>
                  </div>
                </div>
                <button type="submit" class="btn">Update password</button>
              </form>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="js/helpers.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
